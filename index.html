    <script>
      (function(){
        // Check if order was just submitted
        if(sessionStorage.getItem('orderSubmitted') === 'true'){
          var successMsg = document.getElementById('successMessage');
          successMsg.classList.add('show');
          
          // Hide message after 5 seconds
          setTimeout(function(){
            successMsg.classList.remove('show');
            sessionStorage.removeItem('orderSubmitted');
            sessionStorage.removeItem('orderEmail');
          }, 5000);
        }

        // Update bottom summary as quantities change
        function updateSummary(){
          var q1 = document.getElementById('qty-waldfrucht');
          var q2 = document.getElementById('qty-pflaume');
          var sumW = document.getElementById('sum-wald');
          var sumP = document.getElementById('sum-pflaume');
          var sumWEnd = document.getElementById('sum-wald-end');
          var sumPEnd = document.getElementById('sum-pflaume-end');
          var qty1 = q1 ? (parseInt(q1.value,10) || 0) : 0;
          var qty2 = q2 ? (parseInt(q2.value,10) || 0) : 0;
          if(sumW) sumW.textContent = qty1;
          if(sumP) sumP.textContent = qty2;
          if(sumWEnd) sumWEnd.textContent = qty1;
          if(sumPEnd) sumPEnd.textContent = qty2;
          // disable unified order buttons when both quantities are zero
          var orderBtn = document.getElementById('order-all');
          if(orderBtn) {
            orderBtn.disabled = (qty1 === 0 && qty2 === 0);
          }
          var orderEnd = document.getElementById('order-end');
          if(orderEnd){
            orderEnd.disabled = (qty1 === 0 && qty2 === 0);
          }
        }

        document.querySelectorAll('.qty-input1,.qty-input2').forEach(function(inp){
          inp.addEventListener('input', updateSummary);
        });

        // create fixed bottom order bar once (if not present) and attach its handler
        (function createBottomBar(){
          if (!document.querySelector('.order-bottom')){
            var bottom = document.createElement('div');
            bottom.className = 'order-bottom';
            bottom.innerHTML = '<div class="order-summary">Warenkorb: <span id="summary-wald">Waldfrucht-Orange x <span id="sum-wald">1</span></span> &nbsp; <span id="summary-pflaume">Pflaume-Zimt x <span id="sum-pflaume">1</span></span></div>' +
              '<button id="order-all" class="order-button" aria-label="Bestellen (alle Artikel)" disabled>Bestellen</button>';
            document.body.appendChild(bottom);

            // attach handler once
            document.getElementById('order-all').addEventListener('click', function(e){
              e.preventDefault();
              var q1 = document.getElementById('qty-waldfrucht');
              var q2 = document.getElementById('qty-pflaume');
              var item1 = 'Waldfrucht-Orange';
              var item2 = 'Pflaume-Zimt';
              var qty1 = q1 ? (parseInt(q1.value,10)||0) : 0;
              var qty2 = q2 ? (parseInt(q2.value,10)||0) : 0;
              if(qty1 === 0 && qty2 === 0) return;
              
              // Build URL with only items that have quantity > 0
              var params = [];
              var itemCount = 0;
              if(qty1 > 0) {
                itemCount++;
                params.push('item' + itemCount + '=' + encodeURIComponent(item1));
                params.push('qty' + itemCount + '=' + encodeURIComponent(qty1));
              }
              if(qty2 > 0) {
                itemCount++;
                params.push('item' + itemCount + '=' + encodeURIComponent(item2));
                params.push('qty' + itemCount + '=' + encodeURIComponent(qty2));
              }
              
              var url = 'order.html?' + params.join('&');
              window.location.href = url;
            });
          }
        })();

        // Handle end-of-page order button
        var orderEndBtn = document.getElementById('order-end');
        if(orderEndBtn) {
          orderEndBtn.addEventListener('click', function(e){
            e.preventDefault();
            var q1 = document.getElementById('qty-waldfrucht');
            var q2 = document.getElementById('qty-pflaume');
            var item1 = 'Waldfrucht-Orange';
            var item2 = 'Pflaume-Zimt';
            var qty1 = q1 ? (parseInt(q1.value,10)||0) : 0;
            var qty2 = q2 ? (parseInt(q2.value,10)||0) : 0;
            if(qty1 === 0 && qty2 === 0) return;
            
            // Build URL with only items that have quantity > 0
            var params = [];
            var itemCount = 0;
            if(qty1 > 0) {
              itemCount++;
              params.push('item' + itemCount + '=' + encodeURIComponent(item1));
              params.push('qty' + itemCount + '=' + encodeURIComponent(qty1));
            }
            if(qty2 > 0) {
              itemCount++;
              params.push('item' + itemCount + '=' + encodeURIComponent(item2));
              params.push('qty' + itemCount + '=' + encodeURIComponent(qty2));
            }
            
            var url = 'order.html?' + params.join('&');
            window.location.href = url;
          });
        }

        // ensure summary and button state are correct on load
        updateSummary();
        updateSummary();

        // Hide fixed bottom bar when static order panel is visible
        var orderEndPanel = document.querySelector('.order-end');
        var orderBottomBar = document.querySelector('.order-bottom');
        
        if(orderEndPanel && orderBottomBar) {
          var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if(entry.isIntersecting) {
                // Static panel is visible, hide bottom bar
                orderBottomBar.style.display = 'none';
              } else {
                // Static panel not visible, show bottom bar
                orderBottomBar.style.display = 'flex';
              }
            });
          }, {
            threshold: 0.1 // Trigger when at least 10% of the element is visible
          });
          
          observer.observe(orderEndPanel);
        }
      })();
    </script>
  </body>
</html>
